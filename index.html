<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do List – Agile XP</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="card">
    <h1>To-Do List</h1>

    <form id="add-form" class="row">
      <input id="title" type="text" placeholder="New task…" autocomplete="off">
      <select id="priority" aria-label="Priority">
        <option>High</option>
        <option selected>Medium</option>
        <option>Low</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <div class="row">
      <input id="search" type="search" placeholder="Search tasks…" autocomplete="off">
      <button id="sort" type="button" class="secondary">Sort by priority</button>
    </div>

    <p id="message" class="message" role="alert"></p>
    <ul id="list" class="list"></ul>
    <p id="counter" class="counter"></p>
  </main>

  <script src="js/todolist.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
