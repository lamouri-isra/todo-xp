<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tests – To-Do List</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    .pass { color: #16a34a; } .fail { color: #dc2626; }
    li { margin: 4px 0; font-family: Consolas, monospace; }
    #summary { font-weight: 700; margin: 16px 0; }
  </style>
</head>
<body>
  <h1>Unit tests</h1>
  <p id="summary"></p>
  <ul id="results"></ul>
  <script src="tests/mini-test.js"></script>
  <script src="js/todolist.js"></script>
  <script src="tests/add.test.js"></script>
  <script src="tests/complete.test.js"></script>
  <script src="tests/delete.test.js"></script>
  <script src="tests/modify.test.js"></script>
  <script src="tests/search.test.js"></script>
  <script src="tests/priority.test.js"></script>
  <script>
    const ul = document.getElementById("results");
    const r = MT.run((ok, name, msg) => {
      const li = document.createElement("li");
      li.className = ok ? "pass" : "fail";
      li.textContent = (ok ? "✔ " : "✘ ") + name + (ok ? "" : " – " + msg);
      ul.appendChild(li);
    });
    const s = document.getElementById("summary");
    s.textContent = r.passed + " passed, " + r.failed + " failed";
    s.className = r.failed ? "fail" : "pass";
  </script>
</body>
</html>
